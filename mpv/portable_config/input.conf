# ============================================================
#  35MM EMULATOR — controles
# ============================================================

# --- Presets 35mm ---
# 0 = NADA DE NADA: quita imagen 35mm, audio analogo, ambient y
# cualquier ajuste de brillo/contraste. Remux 100% puro.
0 script-message all-clean
1 change-list glsl-shaders set "~~/shaders/35mm-1-sutil.glsl"; show-text "35MM Preset 1: SUTIL — grano fino Vision3"
2 change-list glsl-shaders set "~~/shaders/35mm-2-cine2000.glsl"; show-text "35MM Preset 2: CINE 2000s — print + halation + polvo"
3 change-list glsl-shaders set "~~/shaders/35mm-3-veterana.glsl"; show-text "35MM Preset 3: COPIA VETERANA — grano grueso + pelusas"
4 change-list glsl-shaders set "~~/shaders/35mm-4-equilibrado.glsl"; show-text "35MM Preset 4: EQUILIBRADO — colores del 2 + grano y pelusas del 3"

# mpv por defecto ajusta gamma con 5/6 — desactivado para evitar
# cambios accidentales de imagen (los presets ya gradan).
5 ignore
6 ignore

# Rescate: restablece cualquier ajuste accidental de imagen
r no-osd set brightness 0; no-osd set contrast 0; no-osd set gamma 0; no-osd set saturation 0; no-osd set hue 0; show-text "Imagen restablecida (brillo/contraste/gamma/saturacion)"

# --- Presets de audio analogo (scripts/audio-presets.lua) ---
7 script-message audio-preset clean
8 script-message audio-preset optical
9 script-message audio-preset vinyl

# --- Volumen (9/0 estan ocupados por los presets) ---
+ add volume 2
- add volume -2

# --- Ambient: rellenar franjas negras (scripts/ambient-modes.lua) ---
b script-message ambient-cycle

# --- Menu (scripts/menu-35mm.lua): tecla m o click derecho ---
# (el script registra m y MBTN_RIGHT por si mismo)
M cycle mute                        # silencio (m esta ocupada por el menu)

# --- Pistas ---
a cycle audio                       # cambiar pista de audio
s cycle sub                         # cambiar subtitulos
S cycle sub-visibility              # mostrar/ocultar subtitulos
n script-message sub-style toggle   # subtitulos estilo cine 35mm
t add sub-pos -2                    # subir subtitulos (util con barras codificadas)
T add sub-pos 2                     # bajar subtitulos

# --- Navegacion ---
RIGHT seek 10
LEFT  seek -10
UP    seek 60
DOWN  seek -60
SPACE cycle pause
f cycle fullscreen
q quit-watch-later                  # salir guardando posicion

# --- Info ---
i script-binding stats/display-stats-toggle
TAB show-progress
