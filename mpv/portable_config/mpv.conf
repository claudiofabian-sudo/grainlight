# ============================================================
#  35MM EMULATOR — configuracion del motor de reproduccion
#  Pensado para remux 23.976 de alto bitrate -> proyector
# ============================================================

# --- Motor de video: maxima fidelidad ---
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
profile=high-quality

# Deja pasar HDR nativo al proyector si este lo soporta
target-colorspace-hint=yes

# --- Sincronizacion 23.976 ---
# El video manda: cada fotograma se muestra el tiempo exacto,
# el audio se re-muestrea imperceptiblemente para acompañarlo.
# (Ideal: pon el proyector/salida en modo 23.976/24 Hz)
video-sync=display-resample
interpolation=no

# --- Preset 35mm al arrancar (tecla 0 lo quita, 1/2/3 cambian) ---
glsl-shaders="~~/shaders/35mm-2-cine2000.glsl"

# --- Audio ---
alang=es,spa,esp,en,eng
volume=100
volume-max=150
audio-channels=auto-safe

# Si conectas por HDMI a un receptor AV y quieres bitstream
# (TrueHD/Atmos/DTS-HD decodificados por el receptor),
# descomenta la linea siguiente:
#audio-spdif=ac3,eac3,dts,dts-hd,truehd

# --- Subtitulos ---
slang=es,spa,esp
sub-auto=fuzzy
# Base "normal" ~= estandar de sala: altura de mayusculas ~5% de la
# altura de la IMAGEN (52/720 de fuente ~= 7.2%, mayusculas ~5%)
sub-font-size=52
# Tamano proporcional al video (no a la ventana). La posicion en
# modo normal es la clasica (abajo, usando las franjas); el modo
# cine (tecla n) los ancla dentro de la imagen real.
sub-scale-by-window=no

# --- Comportamiento ---
fs=yes
keep-open=yes
save-position-on-quit=yes
osd-duration=2500
osd-font-size=34
screenshot-format=png
screenshot-directory=~~desktop/
